<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Name | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 18px 8%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 50px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero h2 {
            font-size: 25px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: #94a3b8;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #7dd3fc;
        }

        /* Sections */
        section {
            padding: 80px 10%;
        }

        .title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 40px;
            color: #38bdf8;
        }

        /* About */
        .about {
            max-width: 850px;
            margin: auto;
            text-align: center;
            color: #cbd5e1;
        }

        /* Skills */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .skill {
            padding: 15px 25px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        /* Education */
        .education {
            max-width: 800px;
            margin: auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .education h3 {
            color: #38bdf8;
        }

        .education p {
            color: #cbd5e1;
        }

        /* Projects */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            transition: 0.3s;
            border: 1px solid #334155;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: #38bdf8;
        }

        .project-card h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #cbd5e1;
        }

        /* Certifications */
        .certificates {
            text-align: center;
        }

        .certificate {
            background: #1e293b;
            padding: 20px;
            margin: 15px auto;
            max-width: 700px;
            border-radius: 12px;
        }

        .certificate h3 {
            color: #38bdf8;
        }

        /* Contact */
        .contact {
            text-align: center;
        }

        .contact p {
            margin: 10px;
            color: #cbd5e1;
        }

        .contact a {
            color: #38bdf8;
            text-decoration: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            background: #020617;
            color: #94a3b8;
        }

        @media (max-width: 700
